# Distilled from 7 review threads; generated by scripts/distill_v1.py.
severity = 'nit'
threshold = 0.40
paths = ['api/**/*.py']
gate = true
hint = '->\s*(?:object|Any)\b|:\s*(?:object|Any)\b|\*\*?\w+\s*[,)]'
examples = [
  'https://github.com/langgenius/dify/pull/45766#discussion_r4505010078',
  'https://github.com/langgenius/dify/pull/45767#discussion_r4505008980',
  'https://github.com/langgenius/dify/pull/45767#discussion_r4505009279',
  'https://github.com/langgenius/dify/pull/45770#discussion_r4505012869',
  'https://github.com/langgenius/dify/pull/45770#discussion_r4505013226',
  'https://github.com/langgenius/dify/pull/43588#discussion_r4196654446',
  'https://github.com/langgenius/dify/pull/36791#discussion_r3321695422',
]


[choice]
question = '''
How should the `object` / `Any` annotation, or the catch-all `*args` / `**kwargs`, in `patch` be fixed?'''

[choice.options.paramspec]
criteria = '''
`*args` / `**kwargs` are forwarded to, or stand in for, another callable: a wrapper, a decorator, a mock side_effect, a fake of a real function.'''
comment = '''
This forwards to another callable, so use a ParamSpec: `def f[**P](*args: P.args, **kwargs: P.kwargs)`, and the signature follows the callable it wraps.'''

[choice.options.explicit-params]
criteria = '''
`*args` / `**kwargs` (typed `object`, `Any` or untyped) are used for a fixed set of known arguments, for example a helper or factory that reads specific keys from kwargs, instead of declaring those parameters.'''
comment = '''
This doesn't need `**kwargs`: write the parameters out with their types. It's just a test helper, so listing every parameter is fine.'''

[choice.options.concrete-type]
criteria = '''
A return value or a named parameter is annotated `object` or `Any` while the concrete type is evident from the code (for example a function that returns a str or a Session).'''
comment = '''
Please use the precise type here (e.g. `-> str`, `-> Session`, `Callable[...]`), not `object` / `Any`.'''

[choice.options.fine]
criteria = '''
`patch` adds no `object` / `Any` annotation and no catch-all `*args` / `**kwargs`, or `object` is the honest type (a value that really can be anything and is only passed through to a sink like logging).'''
