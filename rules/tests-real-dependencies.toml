[choice]
question = '''
How should the test double or patch in `patch` be removed?'''

[choice.options.import-real-class]
criteria = '''
A Mock, MagicMock, SimpleNamespace, create_autospec or hand-written fake stands in for an object whose real class can be imported and built in a test: a model, a pydantic entity, a dataclass, a small internal service.'''
comment = '''
Can we import and use the real class here instead of a stand-in? Then the test checks the real behaviour, not the mock.'''

[choice.options.use-sqlite-session]
criteria = '''
The stand-in or setup replaces a SQLAlchemy Session, engine or table setup: a mocked session, object() as a session, __table__.create, metadata.create_all, a Flask-SQLAlchemy app.'''
comment = '''
Please use the shared `sqlite_session` fixture with real rows (`session.add(Model(...))`) instead of a hand-built database or a mocked session.'''

[choice.options.inject-dependency]
criteria = '''
The test patches or monkeypatches a module-level global or hidden internal dependency of dify's own code (db, current_user, current_account_with_tenant, a service method) that the production code reaches for instead of receiving as a parameter.'''
comment = '''
Rather than patching this in the test, change the production code to take the dependency as a parameter (pass the session / account / service in), so the test hands in a real one and needs no patch.'''

[choice.options.protocol-di]
criteria = '''
The patch or fake replaces an external boundary: an HTTP or network client, a third-party SDK, the clock or time, randomness, the filesystem or the environment.'''
comment = '''
This is an external boundary: define a small `typing.Protocol` for what the code needs, have the production code accept it as a parameter, and pass a fake that implements the Protocol in the test, instead of patching or mocking it.'''

[choice.options.no-double]
criteria = '''
`patch` does not introduce or keep a test double, a patch or a hand-built database.'''
