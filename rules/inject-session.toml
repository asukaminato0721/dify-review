# Distilled from 8 review threads; generated by scripts/distill_v1.py.
# Widened 2026-11-16 (dify#46125): any production code reaching for a global session or
# session factory, not only controllers and services, and not only db.session.
gate = true
severity = 'should'
threshold = 0.75
paths = ['api/clients/**/*.py', 'api/commands/**/*.py', 'api/controllers/**/*.py', 'api/core/**/*.py', 'api/domain/**/*.py', 'api/enterprise/**/*.py', 'api/events/**/*.py', 'api/extensions/**/*.py', 'api/factories/**/*.py', 'api/fields/**/*.py', 'api/libs/**/*.py', 'api/machinery/**/*.py', 'api/models/**/*.py', 'api/repositories/**/*.py', 'api/schedule/**/*.py', 'api/services/**/*.py', 'api/tasks/**/*.py']
hint = 'session\s+or\s+db\.session|session:\s*[\w\[\]. ]+\|\s*None\s*=\s*None|\bdb\.session\b|session_factory\.create_session\(|Session\(db\.engine'
propose_guard = true
examples = [
  'https://github.com/langgenius/dify/pull/43112#discussion_r4129096490',
  'https://github.com/langgenius/dify/pull/42034#discussion_r4001911783',
  'https://github.com/langgenius/dify/pull/42034#discussion_r4037113695',
  'https://github.com/langgenius/dify/pull/40379#discussion_r3744084048',
  'https://github.com/langgenius/dify/pull/37639#discussion_r3435610073',
  'https://github.com/langgenius/dify/pull/37639#discussion_r3435610893',
  'https://github.com/langgenius/dify/pull/37639#discussion_r3435612629',
  'https://github.com/langgenius/dify/pull/37639#discussion_r3435613803',
]

[noul]
question = '''
Does `patch` make production code reach for a global database session instead of receiving it: using `db.session` / `db.session()`, calling a module-level `session_factory.create_session()`, building `Session(db.engine)`, or making a session parameter optional with a fallback to a global? Replacing one global (db.session) with another (session_factory) still counts.'''
comment = '''
Take the session as a required parameter instead of reaching for a global (`@with_session` injects it in controllers). If this code must open and commit its own short transaction, take the session factory as a parameter instead (e.g. in `__init__`). Then tests pass `sqlite_session` / `sqlite_session_factory` directly and need no monkeypatch, and can assert the committed row from another session instead of counting commits.'''
